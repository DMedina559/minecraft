name: Build Lint Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'addons/transfer_ui/**'
      - 'addons/transfer_ui_bsm/**'
      - 'addons/bsm_api_client/**'
      - '.github/workflows/build-test.yml'
      - 'scripts/build_transfer_packs.py'
      - 'scripts/generate_bsm_contract.py'
      - 'scripts/tests/**'
  pull_request:
    paths:
      - 'addons/transfer_ui/**'
      - 'addons/transfer_ui_bsm/**'
      - 'addons/bsm_api_client/**'
      - '.github/workflows/build-test.yml'
      - 'scripts/build_transfer_packs.py'
      - 'scripts/generate_bsm_contract.py'
      - 'scripts/tests/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend
      - name: Install dependencies
        run: python -m pip install -e ./backend
      - name: Build package
        run: python scripts/build_transfer_packs.py
      - name: Lint and type checks
        run: |
          python -m bedrock_server_manager.web.contract --output "$RUNNER_TEMP/backend-openapi.json"
          python scripts/generate_bsm_contract.py "$RUNNER_TEMP/backend-openapi.json" --check
      - name: Run tests
        run: |
          node --experimental-vm-modules --test addons/transfer_ui/tests/*.test.mjs addons/bsm_api_client/tests/client.test.mjs
          python -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-ui-packs
          path: dist/transfer-ui/
          if-no-files-found: error
