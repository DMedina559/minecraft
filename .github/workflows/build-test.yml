name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'addons/transfer_ui/**'
      - 'addons/transfer_ui_bsm/**'
      - 'addons/bsm_api_client/**'
      - '.github/workflows/build-test.yml'
      - 'scripts/build_transfer_packs.py'
      - 'scripts/tests/**'
  pull_request:
    paths:
      - 'addons/transfer_ui/**'
      - 'addons/transfer_ui_bsm/**'
      - 'addons/bsm_api_client/**'
      - '.github/workflows/build-test.yml'
      - 'scripts/build_transfer_packs.py'
      - 'scripts/tests/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build transfer UI packs
        run: python scripts/build_transfer_packs.py
      - name: Run tests
        run: |
          node --experimental-vm-modules --test addons/transfer_ui/tests/*.test.mjs addons/bsm_api_client/tests/client.test.mjs
          python -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: transfer-ui-packs
          path: dist/transfer-ui/
          if-no-files-found: error
          retention-days: 7
