name: Transfer UI addon tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'addons/transfer_ui/**'
      - 'addons/transfer_ui_bsm/**'
      - 'addons/bsm_api_client/**'
      - '.github/workflows/transfer-ui-tests.yml'
      - 'scripts/build_transfer_packs.py'
      - 'scripts/generate_bsm_contract.py'
      - 'scripts/tests/**'
  pull_request:
    paths:
      - 'addons/transfer_ui/**'
      - 'addons/transfer_ui_bsm/**'
      - 'addons/bsm_api_client/**'
      - '.github/workflows/transfer-ui-tests.yml'
      - 'scripts/build_transfer_packs.py'
      - 'scripts/generate_bsm_contract.py'
      - 'scripts/tests/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --experimental-vm-modules --test addons/transfer_ui/tests/*.test.mjs addons/bsm_api_client/tests/client.test.mjs
  packs:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend-contract
      - run: python -m pip install ./backend-contract
      - name: Verify canonical backend contract
        run: |
          python -m bedrock_server_manager.web.contract --output "$RUNNER_TEMP/backend-openapi.json"
          python scripts/generate_bsm_contract.py "$RUNNER_TEMP/backend-openapi.json" --check
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/build_transfer_packs.py
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-ui-packs
          path: dist/transfer-ui/
          if-no-files-found: error
