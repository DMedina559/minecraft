name: Lint and Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'addons/bsm_api_client/**'
      - 'scripts/generate_bsm_contract.py'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'addons/bsm_api_client/**'
      - 'scripts/generate_bsm_contract.py'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Advisory check: upstream bedrock-server-manager@dev drift is synced via PR by sync-contracts.yml.
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend
          persist-credentials: false
      - name: Install backend dependencies
        run: python -m pip install -e ./backend
      - name: Check BSM OpenAPI contract
        run: |
          python -m bedrock_server_manager.web.contract --output "$RUNNER_TEMP/backend-openapi.json"
          python scripts/generate_bsm_contract.py "$RUNNER_TEMP/backend-openapi.json" --check
