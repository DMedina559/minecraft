name: Sync Contracts

on:
  repository_dispatch:
    types: [bsm-contract-updated]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Exact bedrock-server-manager commit SHA or ref
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    uses: DMedina559/.github/.github/workflows/reusable-sync-contracts.yml@main
    with:
      target-branch: main
      backend-ref: ${{ inputs.backend_sha || github.event.client_payload.backend_sha || 'dev' }}
      contract-hash: ${{ github.event.client_payload.contract_hash || '' }}
      setup-node: true
      openapi-output: /tmp/backend-openapi.json
      generate-command: python scripts/generate_bsm_contract.py /tmp/backend-openapi.json
      verify-command: |
        node --experimental-vm-modules --test addons/transfer_ui/tests/*.test.mjs addons/bsm_api_client/tests/client.test.mjs
        python -m unittest discover -s scripts/tests -v
      pr-title: 'feat(api): sync generated BSM contract from bedrock-server-manager'
    secrets:
      SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
